name: Pull Request Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out complete review history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the hash-locked graph
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check formatting and behavior
        run: |
          ruff check src scripts tests
          python -m pytest tests -v
          python scripts/generate_schemas.py
          git diff --exit-code -- schemas
          python scripts/validate_sources.py

      - name: Materialize base source records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_root="${RUNNER_TEMP}/registry-base"
          mkdir -p "${base_root}/modules"
          if git cat-file -e "${BASE_SHA}:modules"; then
            git archive "${BASE_SHA}" modules | tar -x -C "${base_root}"
          fi

      - name: Protect ownership and re-inspect new Releases
        run: |
          python scripts/check_ownership_diff.py \
            --base-dir "${RUNNER_TEMP}/registry-base/modules" \
            --head-dir modules
          python scripts/validate_new_releases.py \
            --base-dir "${RUNNER_TEMP}/registry-base/modules" \
            --head-dir modules

      - name: Build identical unsigned candidates twice
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          generated_at="$(git show -s --format=%cI "${HEAD_SHA}")"
          python scripts/build_registry.py \
            --modules modules \
            --generated-at "${generated_at}" \
            --output dist/candidate-registry-v1.json
          python scripts/build_registry.py \
            --modules modules \
            --generated-at "${generated_at}" \
            --output dist/candidate-registry-v1-second.json
          cmp \
            dist/candidate-registry-v1.json \
            dist/candidate-registry-v1-second.json

      - name: Upload unsigned candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-registry-v1
          path: dist/candidate-registry-v1.json
          if-no-files-found: error

