name: Publish Signed Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: registry-production
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONPATH: src
    steps:
      - name: Check out protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the hash-locked graph
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Repeat the complete validation gate
        run: |
          ruff check src scripts tests
          python -m pytest tests -v
          python scripts/validate_sources.py

      - name: Build exact index bytes
        run: |
          generated_at="$(git show -s --format=%cI HEAD)"
          python scripts/build_registry.py \
            --modules modules \
            --generated-at "${generated_at}" \
            --output dist/registry-v1.json

      - name: Sign exact index bytes
        env:
          REGISTRY_ED25519_PRIVATE_KEY: ${{ secrets.REGISTRY_ED25519_PRIVATE_KEY }}
        run: |
          python scripts/sign_registry.py \
            --index dist/registry-v1.json \
            --output dist/registry-v1.sig \
            --key-id registry-2026-01

      - name: Verify with the reviewed public key
        run: |
          python scripts/verify_registry.py \
            --index dist/registry-v1.json \
            --signature dist/registry-v1.sig \
            --public-key keys/registry-2026-01.public.json

      - name: Construct the exact Pages payload
        run: |
          python scripts/build_pages.py \
            --index dist/registry-v1.json \
            --signature dist/registry-v1.sig \
            --output pages
          file_count="$(find pages -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "${file_count}" = "3"
          test -f pages/registry-v1.json
          test -f pages/registry-v1.sig
          test -f pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload only the public Pages payload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages

      - name: Deploy signed Registry
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Re-download and verify deployed bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 10 --retry-delay 3 \
            "${PAGE_URL}registry-v1.json" \
            --output /tmp/deployed-registry-v1.json
          curl --fail --location --retry 10 --retry-delay 3 \
            "${PAGE_URL}registry-v1.sig" \
            --output /tmp/deployed-registry-v1.sig
          python scripts/verify_registry.py \
            --index /tmp/deployed-registry-v1.json \
            --signature /tmp/deployed-registry-v1.sig \
            --public-key keys/registry-2026-01.public.json

