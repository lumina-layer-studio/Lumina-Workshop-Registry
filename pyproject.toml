[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-workshop-registry"
version = "0.1.0"
description = "Signed registry tooling for Lumina Studio Workshop modules"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

